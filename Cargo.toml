[package]
name = "hien"
version = "0.1.0"
edition = "2024"

[dependencies]
dirs = "7"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
serde = { version = "1.0.229", features = ["derive"] }
sys-locale = "0.3.2"

[profile.release]
lto = true
codegen-units = 1
strip = true

[package]
name = "hien"
version = "0.3.0"
edition = "2024"
description = "A fast notepad with find, replace and insert word"
repository = "https://github.com/misutesu-desu/hien"

[dependencies]
dirs = "7"
eframe = { version = "0.37", default-features = false, features = ["clipboard", "default_fonts", "glow", "persistence", "wayland", "x11"] }
serde = { version = "1.0.229", features = ["derive"] }
sys-locale = "0.3.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
